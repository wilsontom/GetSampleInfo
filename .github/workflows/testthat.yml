name: build-and-test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
          needs: check

      - name: Build source package
        run: R CMD build .

      - name: Check source package
        run: R CMD check --no-manual --as-cran GetSampleInfo_*.tar.gz
